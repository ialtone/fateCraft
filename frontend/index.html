<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>命运茶馆 fateCraft</title>
    <meta
      name="description"
      content="命运茶馆 fateCraft —— 沉浸式 AI 文字冒险与角色扮演平台。结构化状态面板、世界书、天命判定与「轮回试炼」修仙玩法，支持任意 OpenAI 兼容模型。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 首次访问默认宣纸亮色；已保存的暗色偏好在首屏渲染前恢复，避免闪白/闪黑。
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('gft-theme') === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <!-- 主题色跟随「墨与琥珀」双态配色：亮色宣纸 / 暗色夜茶馆 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3ecdf" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15110d" />
    <!-- 分享卡片（微信/QQ/Discord 等抓取 OG 标签；og:image 待有正式品牌图后补充） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="命运茶馆 fateCraft" />
    <meta property="og:title" content="命运茶馆 fateCraft" />
    <meta
      property="og:description"
      content="沉浸式 AI 文字冒险与角色扮演平台：结构化状态、世界书、天命判定与轮回试炼修仙玩法。"
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
