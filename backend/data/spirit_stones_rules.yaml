# 灵石价值体系 - 严格定价标准
# 灵石是轮回试炼的唯一货币，价值必须统一且严格控制
#
# 注意：本文件为 v1 遗留的设计参考文档，当前无任何代码加载它；
# 运行时实际生效的判定/收益配置见同目录 roll_config.yaml。

# ============================================================================
# 核心原则
# ============================================================================
# 1. 灵石获取必须通过"风险 + 努力"换取，禁止无代价获得
# 2. 所有灵石收益必须通过天命判定系统验证
# 3. 收益越大，判定难度越高（自动触发收益平衡机制）
# 4. 同等难度的挑战，灵石收益应该接近

# ============================================================================
# 标准定价表（按难度和风险等级）
# ============================================================================

# 微小收益（1-10 灵石）
trivial:
  scenarios:
    - 日常任务完成（采药、打坐、跑腿）
    - 击败练气期低阶妖兽
    - 出售低级物品
    - 普通赌局小胜
  range: [1, 10]
  difficulty: 极低
  examples:
    采集灵草三株: 3
    击败练气三层妖兽: 5
    送信任务: 2

# 小额收益（11-100 灵石）
small:
  scenarios:
    - 完成简单任务（护送、打探消息）
    - 击败练气期高阶妖兽
    - 炼制成功低阶丹药
    - 发现小型灵脉
  range: [11, 100]
  difficulty: 低
  examples:
    护送商队通过山道: 30
    击败练气十层妖兽: 50
    炼制聚气丹成功: 40
    发现废弃洞府: 60

# 中等收益（101-1,000 灵石）
medium:
  scenarios:
    - 完成中等难度任务（击杀悬赏目标、破解阵法）
    - 击败筑基期修士/妖兽
    - 炼制成功中阶丹药
    - 获得中品法器
  range: [101, 1000]
  difficulty: 中
  examples:
    击杀筑基初期悬赏犯: 300
    破解古老阵法: 400
    炼制筑基丹成功: 500
    获得中品飞剑: 600

# 重大收益（1,001-10,000 灵石）
major:
  scenarios:
    - 完成高难度任务（剿灭邪修、夺取秘宝）
    - 击败筑基后期/结丹初期强敌
    - 获得上品法器或秘籍
    - 发现中型秘境
  range: [1001, 10000]
  difficulty: 高
  required:
    - 必须通过2-3次高难度判定
    - 必须有明确的风险（受伤、追杀、消耗寿元等）
  examples:
    击杀筑基后期魔修: 3000
    夺取上品法器: 5000
    发现秘境获得传承: 8000

# 巨额收益（10,001-100,000 灵石）
huge:
  scenarios:
    - 完成极高难度任务（击杀结丹修士、破解上古禁制）
    - 获得顶级法宝
    - 发现大型秘境
  range: [10001, 100000]
  difficulty: 极高
  required:
    - 必须通过3-5次极高难度判定
    - 必须有重大代价（重伤、失去重要物品、背负因果债等）
    - 必须分多个阶段完成，每阶段都有独立风险
  examples:
    击杀结丹期邪修: 30000
    获得法宝: 50000
    探索上古宗门遗迹: 80000

# 逆天收益（100,001+ 灵石）
extreme:
  scenarios:
    - 改变命运的重大机遇（元婴传承、仙缘、天材地宝）
  range: [100001, 999999]
  difficulty: 逆天
  required:
    - 必须通过5次以上极限难度判定
    - 必须有极重大代价（失去寿元、道心受损、遭天罚等）
    - 必须分成多个独立章节，每章节都是生死考验
    - 必须触发追杀、诅咒等长期负面效果
  examples:
    获得元婴真人传承: 200000
    炼化仙器残片: 500000
    获得天阶功法: 800000

# ============================================================================
# 禁止事项（AI 绝对不可以这样做）
# ============================================================================
forbidden:
  - 偶然捡到宝箱直接获得大量灵石
  - 无判定、无风险直接赠送灵石
  - 同一类型任务多次重复获得高额灵石（如反复击杀同等级妖兽）
  - 通过漏洞或巧合获得与风险不匹配的收益
  - NPC 无理由赠送大量灵石
  - 商业交易给予远超市价的利润

# ============================================================================
# 灵石消耗标准（参考，暂不强制）
# ============================================================================
expenses:
  daily_living: 1-5          # 客栈、饮食、杂费
  low_pill: 10-50           # 低阶丹药（聚气丹、疗伤丹）
  mid_pill: 100-500         # 中阶丹药（筑基丹、破障丹）
  high_pill: 1000-5000      # 高阶丹药（结金丹）
  low_artifact: 50-500      # 低阶法器
  mid_artifact: 500-5000    # 中阶法器
  high_artifact: 5000-50000 # 上品法器/法宝
  cultivation_spot: 100-1000 # 租用洞府、灵地修炼
  information: 10-1000      # 购买情报、地图

# ============================================================================
# 破碎虚空建议（仅供参考）
# ============================================================================
recommended_milestones:
  - stones: 100
    desc: "最低门槛，体验过轮回即可离去"
  - stones: 1000
    desc: "小有成就，经历了数次考验"
  - stones: 10000
    desc: "颇有建树，算得上一方高手"
  - stones: 100000
    desc: "功德圆满，此生无憾"
  - stones: 1000000
    desc: "逆天改命，惊世骇俗"
