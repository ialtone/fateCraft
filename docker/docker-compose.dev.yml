name: fatecraft

x-log-options: &log-options
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgresql:
    logging: *log-options
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ./backend.development.env
    environment:
      TZ: Asia/Shanghai
    ports:
      - "15433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    logging: *log-options
    image: fatecraft-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - ./backend.development.env
    command: ["./fatecraft-migrate", "up"]

  postgres-backup:
    logging: *log-options
    build:
      context: .
      dockerfile: ./postgres-backup/Dockerfile
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - ./backend.development.env
    environment:
      TZ: Asia/Shanghai
      BACKUP_DIR: /backups
      BACKUP_CRON_SCHEDULE: "0 2 * * *"
      BACKUP_RETENTION_DAYS: 7
    volumes:
      - ./backups:/backups
    cpus: 0.75
    mem_limit: 256m

  backend:
    logging: *log-options
    image: fatecraft-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./backend.development.env
    ports:
      - "8081:8081"
    volumes:
      # 判定配置、输出 Schema 与空库首次初始化材料；运行时挑战内容从 PostgreSQL 读取
      - ../backend/data:/app/backend/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8081/api/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
