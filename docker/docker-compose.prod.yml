name: fatecraft

x-log-options: &log-options
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  fatecraft:
    image: ${FATECRAFT_IMAGE_PREFIX:-ghcr.io/ialtone}/fatecraft:${FATECRAFT_VERSION:-latest}
    container_name: fatecraft
    restart: unless-stopped
    stop_grace_period: 1m
    env_file:
      - ${FATECRAFT_ENV_FILE:-./backend.production.env}
    environment:
      TZ: Asia/Shanghai
      PGDATA: /var/lib/postgresql/18/docker
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    ports:
      - "8088:80"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB && wget -qO- http://127.0.0.1:8081/api/health >/dev/null && wget -qO- http://127.0.0.1:80/ >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *log-options

volumes:
  postgres_data:
