name: fatecraft

services:
  postgresql:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ./backend.production.env
    environment:
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # 数据卷为空（首次启动）时自动执行权威建表脚本 init.sql；已有数据时不会重复执行
      - ../backend/scripts/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-backup:
    build:
      context: .
      dockerfile: ./postgres-backup/Dockerfile
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - ./backend.production.env
    environment:
      TZ: Asia/Shanghai
      BACKUP_DIR: /backups
      BACKUP_CRON_SCHEDULE: "0 2 * * *"
      BACKUP_RETENTION_DAYS: 7
    volumes:
      - ./backups:/backups
    cpus: 0.75
    mem_limit: 256m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - ./backend.production.env
    ports:
      # 只绑定本机回环地址：公网流量必须经过 nginx（8088），后端端口不能被直接访问，
      # 否则客户端可以伪造 X-Forwarded-For，并绕过 nginx 添加的安全响应头。
      - "127.0.0.1:8081:8081"
    volumes:
      # 判定配置、输出 Schema 与空库首次初始化材料；运行时挑战内容从 PostgreSQL 读取
      - ../backend/data:/app/backend/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8081/api/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
