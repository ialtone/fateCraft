# Fatecraft 前端站点：SPA 静态托管 + /api 与 /ws 反代到后端容器。
map $uri $fatecraft_log_uri {
    ~^/s/                                  /s/[REDACTED];
    ~^/api/public/conversation-shares/     /api/public/conversation-shares/[REDACTED];
    default                                $uri;
}

log_format fatecraft_redacted '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $fatecraft_log_uri $server_protocol" $status $body_bytes_sent '
                               '"-" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log fatecraft_redacted;

    # 与后端最大请求体一致：挑战版本保存（PUT /api/admin/challenge-versions/:id）允许 32 MiB。
    client_max_body_size 33m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 分享入口由后端输出动态 Open Graph 摘要，再跳转到独立 SPA 阅读路由。
    # 该请求不做共享缓存，确保撤销和管理员下架立即生效。
    location /s/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 服务端分享外壳跳转后的匿名 SPA 阅读页。
    location /shared/ {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.ldstatic.com https://linux.do https://*.linux.do; connect-src 'self' https://cdn.ldstatic.com https://linux.do https://*.linux.do; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        try_files /index.html =404;
    }

    # WebSocket（流式生成）
    location /ws/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
