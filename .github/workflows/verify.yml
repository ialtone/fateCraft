name: verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fatecraft
          POSTGRES_PASSWORD: fatecraft
          POSTGRES_DB: fatecraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fatecraft -d fatecraft_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FATECRAFT_TEST_DATABASE_URL: postgres://fatecraft:fatecraft@localhost:5432/fatecraft_test?sslmode=disable
      FATECRAFT_REQUIRE_TEST_DATABASE: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -count=1 -timeout=10m ./...
      - run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
