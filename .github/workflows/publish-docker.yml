name: publish-docker

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ialtone/fatecraft
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=fatecraft
          cache-to: type=gha,mode=max,scope=fatecraft

  bundle:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build Linux release bundles
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          out="$PWD/release-build"
          rm -rf "$out"
          mkdir -p "$out"

          for arch in amd64 arm64; do
            dir="$out/fatecraft-linux-$arch"
            mkdir -p "$dir"

            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "$dir/fatecraft" ./cmd/server)
            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "$dir/fatecraft-migrate" ./cmd/migrate)
            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "$dir/fatecraft-gameplay-check" ./cmd/gameplay-check)

            cp -R frontend/dist "$dir/dist"
            cp -R backend/data "$dir/data"
            cp docker/release/README.md "$dir/README.md"
            cp docker/release/.env.example "$dir/.env.example"
            cp LICENSE "$dir/LICENSE"
            printf '%s\n' "$VERSION" > "$dir/VERSION"
            sed 's#root /usr/share/nginx/html;#root /opt/fatecraft/dist;#' docker/frontend/nginx.conf > "$dir/nginx.conf"
            chmod +x "$dir/fatecraft" "$dir/fatecraft-migrate" "$dir/fatecraft-gameplay-check"

            tar --owner=0 --group=0 -C "$out" -czf "$out/fatecraft-linux-$arch.tar.gz" "fatecraft-linux-$arch"
          done

          (cd "$out" && sha256sum fatecraft-linux-amd64.tar.gz fatecraft-linux-arm64.tar.gz > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: fatecraft-release-assets
          path: |
            release-build/fatecraft-linux-amd64.tar.gz
            release-build/fatecraft-linux-arm64.tar.gz
            release-build/checksums.txt
          if-no-files-found: error

  release:
    needs:
      - publish
      - bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fatecraft-release-assets
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          gh release create "$tag" release-assets/* --verify-tag --generate-notes --title "$tag" --repo "$GITHUB_REPOSITORY"
